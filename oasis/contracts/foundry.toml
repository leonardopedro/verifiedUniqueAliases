[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.28"
evm_version = "paris"        # Paris: no PUSH0, matches Sapphire's deployable EVM
optimizer = true
optimizer_runs = 200
via_ir = true           # the parity test builds a deep abi.encode expression

# The parity test reads the Rust-generated vector one directory up.
fs_permissions = [{ access = "read", path = "../fixtures" }]

[fmt]
line_length = 100
