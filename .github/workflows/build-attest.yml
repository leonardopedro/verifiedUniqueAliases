name: Build VM Image and Attest

on:
  push:
    branches: [main, l-branch-1, alibabacloud]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      # One leg failing must not cancel the other: the alibabacloud leg is the
      # line of record on its branch, and the GCP leg cannot even build there
      # (Dockerfile.repro COPYs build-gcp-gpt-image.sh, which only exists on
      # main — the alibabacloud branch deliberately dropped the GCP image
      # tooling). The GCP leg is therefore gated to main below.
      fail-fast: false
      matrix:
        include:
          - platform: gcp
            dockerfile: Dockerfile.repro
            features: ""
            label: "GCP AMD SEV-SNP"
            # Dockerfile.repro has no assembler stage — image-builder is its
            # last stage and already exposes the artifacts below.
            target: image-builder
          - platform: alibabacloud
            dockerfile: Dockerfile.alibaba
            features: "alibabacloud"
            label: "Alibaba Cloud Intel TDX"
            # The bootable ESP disk is assembled in the `assembler` stage
            # (Dockerfile.alibaba) and copied to /disk-alibaba.raw — building
            # only image-builder (the ancestor stage) would never produce it,
            # so the disk attestation below depends on this target.
            target: assembler

    steps:
      - uses: actions/checkout@v4

      # Fail fast before the expensive image build: the auditor page is the
      # trust surface every login depends on, so its offline regression suite
      # (real runAudit() driven with synthetic TDX/GCP fixtures — 68 checks)
      # gates both legs. node-forge is pinned to the exact CDN version
      # verify.html loads (forge/1.3.1) so the harness runs the same library
      # auditors get in the browser.
      - name: verify.html security regression tests
        run: |
          npm install
          node scripts/test-verify-security.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Build and extract artifacts
        if: matrix.platform != 'gcp' || github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          # Shared-runner registry pulls (dockerhub anonymous rate limits,
          # snapshot.debian.org hiccups) are the only observed CI failure
          # mode — the identical build+extract sequence passes locally, so
          # retry the build once before failing the job. The tail of each
          # failed attempt is surfaced as a job annotation (publicly
          # readable via the check-run annotations API) because raw job
          # logs require repo-admin access.
          for attempt in 1 2; do
            if docker build --no-cache --load --target ${{ matrix.target }} -f ${{ matrix.dockerfile }} -t paypal-auth-vm:${{ matrix.platform }} . 2>&1 | tee /tmp/docker-build.log; then
              break
            fi
            echo "::error title=docker build failed (attempt $attempt)::$(tail -c 1800 /tmp/docker-build.log | tr '\n' '|' )"
            [ "$attempt" = 1 ] && { echo "build attempt 1 failed — retrying once"; sleep 20; } || exit 1
          done
          CONTAINER_ID=$(docker create paypal-auth-vm:${{ matrix.platform }})
          docker cp $CONTAINER_ID:/build/paypal-auth-vm-bin ./paypal-auth-vm-${{ matrix.platform }}.bin || docker cp $CONTAINER_ID:/paypal-auth-vm-bin ./paypal-auth-vm-${{ matrix.platform }}.bin
          docker cp $CONTAINER_ID:/build/output/vmlinuz ./vmlinuz-${{ matrix.platform }} || true
          docker cp $CONTAINER_ID:/build/output/initramfs-paypal-auth.img ./initramfs-${{ matrix.platform }}.img || docker cp $CONTAINER_ID:/initramfs-paypal-auth.img ./initramfs-${{ matrix.platform }}.img || true
          docker cp $CONTAINER_ID:/build/output/shimx64.efi ./shimx64-${{ matrix.platform }}.efi || true
          docker cp $CONTAINER_ID:/build/output/grubx64.efi ./grubx64-${{ matrix.platform }}.efi || true
          docker cp $CONTAINER_ID:/grub.cfg ./grub-${{ matrix.platform }}.cfg || true
          docker cp $CONTAINER_ID:/disk.tar.gz ./disk-${{ matrix.platform }}.tar.gz || true
          # Alibaba ESP disk: produced by Dockerfile.alibaba's assembler stage
          # at /disk-alibaba.raw (the GCP leg has no such file → || true).
          docker cp $CONTAINER_ID:/disk-alibaba.raw ./disk-alibaba.raw || true
          docker cp $CONTAINER_ID:/packages.txt ./packages-${{ matrix.platform }}.txt || true
          docker cp $CONTAINER_ID:/build/packages.txt ./packages-${{ matrix.platform }}.txt || true
          docker rm $CONTAINER_ID
          echo "==== ARTIFACT HASHES (${{ matrix.label }}) ===="
          # `|| true` is REQUIRED here: the alibabacloud image has no
          # /grub.cfg or disk.tar.gz (those come from build-gcp-gpt-image.sh),
          # sha256sum exits 1 on any missing file, and `bash -e` would kill the
          # step after all the real work already succeeded. This missing
          # tolerance was the deterministic CI failure of the alibabacloud leg.
          sha256sum paypal-auth-vm-${{ matrix.platform }}.bin vmlinuz-${{ matrix.platform }} initramfs-${{ matrix.platform }}.img shimx64-${{ matrix.platform }}.efi grubx64-${{ matrix.platform }}.efi grub-${{ matrix.platform }}.cfg disk-${{ matrix.platform }}.tar.gz disk-alibaba.raw 2>/dev/null || true
          echo "========================="
          # Publish the attested disk digest as a check-run annotation — job
          # logs are repo-admin-only, but annotations are publicly readable via
          # the check-runs API, so auditors can look the digest up against the
          # "Attest ESP Disk Image" attestation without repo access.
          if [ -f disk-alibaba.raw ]; then
            echo "::notice title=disk-alibaba.raw sha256::$(sha256sum disk-alibaba.raw | cut -d' ' -f1)"
          fi

      - name: Attest Enclave Binary
        if: matrix.platform != 'gcp' || github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Enclave Binary (${{ matrix.label }})
          subject-path: paypal-auth-vm-${{ matrix.platform }}.bin

      - name: Attest Kernel
        if: matrix.platform == 'gcp' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Linux Kernel (${{ matrix.label }})
          subject-path: vmlinuz-${{ matrix.platform }}

      - name: Attest Initrd
        if: matrix.platform != 'gcp' || github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Initramfs (${{ matrix.label }})
          subject-path: initramfs-${{ matrix.platform }}.img

      - name: Attest Bootloader
        if: matrix.platform == 'gcp' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: EFI Bootloader (${{ matrix.label }})
          subject-path: |
            shimx64-${{ matrix.platform }}.efi
            grubx64-${{ matrix.platform }}.efi
            grub-${{ matrix.platform }}.cfg

      - name: Attest VM Disk Image
        if: matrix.platform == 'gcp' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: VM Disk Image (${{ matrix.label }})
          subject-path: disk-${{ matrix.platform }}.tar.gz

      # The Alibaba bootable ESP disk is the object that gets imported into ECS
      # (import-alibaba-image.sh uploads output-alibaba/disk-alibaba.raw), so it
      # is the artifact auditors must be able to pin to a CI run — a missing
      # file fails the step rather than silently skipping the attestation.
      - name: Attest ESP Disk Image
        if: matrix.platform == 'alibabacloud'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ESP Disk Image (${{ matrix.label }})
          subject-path: disk-alibaba.raw

      # v165 audit: verify.html's provenance row now gates the ENTIRE boot
      # chain — shim/BOOTX64.EFI and grubx64.efi actually execute the kernel,
      # so a loader swapped onto the disk by the cloud provider must surface
      # as "not attested by CI" instead of passing unchecked.
      - name: Attest ESP Boot Chain
        if: matrix.platform == 'alibabacloud'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ESP Boot Chain (${{ matrix.label }})
          subject-path: |
            shimx64-${{ matrix.platform }}.efi
            grubx64-${{ matrix.platform }}.efi

      - name: Upload artifacts
        if: matrix.platform != 'gcp' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vm-artifacts-${{ matrix.platform }}
          path: |
            paypal-auth-vm-${{ matrix.platform }}.bin
            initramfs-${{ matrix.platform }}.img
            vmlinuz-${{ matrix.platform }}
            disk-${{ matrix.platform }}.tar.gz
            disk-alibaba.raw
          retention-days: 7