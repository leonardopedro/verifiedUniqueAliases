name: Build VM Image and Attest

on:
  push:
    branches: [main, l-branch-1, alibabacloud]
  workflow_dispatch:

# v180 (audit.md §3.2 — pure-play Alibaba Cloud Intel TDX): the GCP
# (AMD SEV-SNP / Dockerfile.repro) leg is permanently removed. This branch
# builds, attests and ships ONLY the Alibaba Cloud Intel TDX image
# (Dockerfile.alibaba, `assembler` target → bootable ESP disk at
# /disk-alibaba.raw). Attested artifacts: the enclave binary, vmlinuz,
# initramfs-paypal-auth.img, the ESP boot chain (shim/grub/grub.cfg) and the
# bootable disk itself.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Fail fast before the expensive image build: the auditor page is the
      # trust surface every login depends on, so its offline regression suite
      # (real runAudit() driven with synthetic TDX fixtures — 155+ checks)
      # gates the build. node-forge is pinned to the exact CDN version
      # verify.html loads (forge/1.3.1) so the harness runs the same library
      # auditors get in the browser.
      - name: verify.html security regression tests
        run: |
          npm install
          node scripts/test-verify-security.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Build and extract artifacts
        run: |
          set -o pipefail
          # Shared-runner registry pulls (dockerhub anonymous rate limits,
          # snapshot.debian.org hiccups) are the only observed CI failure
          # mode — the identical build+extract sequence passes locally, so
          # retry the build once before failing the job. The tail of each
          # failed attempt is surfaced as a job annotation (publicly
          # readable via the check-run annotations API) because raw job
          # logs require repo-admin access.
          for attempt in 1 2; do
            if docker build --no-cache --load --target assembler -f Dockerfile.alibaba -t paypal-auth-vm:alibabacloud . 2>&1 | tee /tmp/docker-build.log; then
              break
            fi
            echo "::error title=docker build failed (attempt $attempt)::$(tail -c 1800 /tmp/docker-build.log | tr '\n' '|' )"
            [ "$attempt" = 1 ] && { echo "build attempt 1 failed — retrying once"; sleep 20; } || exit 1
          done
          CONTAINER_ID=$(docker create paypal-auth-vm:alibabacloud)
          docker cp $CONTAINER_ID:/build/paypal-auth-vm-bin ./paypal-auth-vm-alibabacloud.bin || docker cp $CONTAINER_ID:/paypal-auth-vm-bin ./paypal-auth-vm-alibabacloud.bin
          docker cp $CONTAINER_ID:/build/output/vmlinuz ./vmlinuz-alibabacloud || true
          docker cp $CONTAINER_ID:/build/output/initramfs-paypal-auth.img ./initramfs-alibabacloud.img || docker cp $CONTAINER_ID:/initramfs-paypal-auth.img ./initramfs-alibabacloud.img || true
          docker cp $CONTAINER_ID:/build/output/shimx64.efi ./shimx64-alibabacloud.efi || true
          docker cp $CONTAINER_ID:/build/output/grubx64.efi ./grubx64-alibabacloud.efi || true
          docker cp $CONTAINER_ID:/grub.cfg ./grub-alibabacloud.cfg || true
          # Alibaba ESP disk: produced by Dockerfile.alibaba's assembler stage
          # at /disk-alibaba.raw — the object import-alibaba-image.sh uploads
          # to OSS, so a missing file fails the step rather than silently
          # skipping the attestation below.
          docker cp $CONTAINER_ID:/disk-alibaba.raw ./disk-alibaba.raw
          docker cp $CONTAINER_ID:/packages.txt ./packages-alibabacloud.txt || docker cp $CONTAINER_ID:/build/packages.txt ./packages-alibabacloud.txt || true
          docker rm $CONTAINER_ID
          echo "==== ARTIFACT HASHES (Alibaba Cloud Intel TDX) ===="
          # `|| true` is REQUIRED here: sha256sum exits 1 on any missing file,
          # and `bash -e` would kill the step after all the real work already
          # succeeded. This missing tolerance was the deterministic CI failure
          # of the alibabacloud leg.
          sha256sum paypal-auth-vm-alibabacloud.bin vmlinuz-alibabacloud initramfs-alibabacloud.img shimx64-alibabacloud.efi grubx64-alibabacloud.efi grub-alibabacloud.cfg disk-alibaba.raw 2>/dev/null || true
          echo "========================="
          # Publish the attested disk digest as a check-run annotation — job
          # logs are repo-admin-only, but annotations are publicly readable via
          # the check-runs API, so auditors can look the digest up against the
          # "Attest ESP Disk Image" attestation without repo access.
          if [ -f disk-alibaba.raw ]; then
            echo "::notice title=disk-alibaba.raw sha256::$(sha256sum disk-alibaba.raw | cut -d' ' -f1)"
          fi

      - name: Attest Enclave Binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Enclave Binary (Alibaba Cloud Intel TDX)
          subject-path: paypal-auth-vm-alibabacloud.bin

      - name: Attest Initrd
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Initramfs (Alibaba Cloud Intel TDX)
          subject-path: initramfs-alibabacloud.img

      # The boot chain the ESP loads: kernel + shim + grub + grub.cfg in one
      # attestation (verify.html's Image Atomicity gate looks each hash up by
      # digest — every component must resolve to THIS run).
      - name: Attest ESP Boot Chain
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ESP Boot Chain (Alibaba Cloud Intel TDX)
          subject-path: |
            vmlinuz-alibabacloud
            shimx64-alibabacloud.efi
            grubx64-alibabacloud.efi
            grub-alibabacloud.cfg

      # The Alibaba bootable ESP disk is the object that gets imported into
      # ECS (import-alibaba-image.sh uploads output-alibaba/disk-alibaba.raw),
      # so it is the artifact auditors must be able to pin to a CI run.
      - name: Attest ESP Disk Image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ESP Disk Image (Alibaba Cloud Intel TDX)
          subject-path: disk-alibaba.raw

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vm-artifacts-alibabacloud
          path: |
            paypal-auth-vm-alibabacloud.bin
            initramfs-alibabacloud.img
