name: Build VM Image and Attest

on:
  push:
    branches: [main, l-branch-1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - platform: gcp
            dockerfile: Dockerfile.repro
            features: ""
            label: "GCP AMD SEV-SNP"
            disk-file: disk-gcp.tar.gz
          - platform: oci
            dockerfile: Dockerfile.oci
            features: "oci"
            label: "Oracle Cloud AMD SEV-SNP"
            disk-file: disk-oci.qcow2

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and extract artifacts
        run: |
          docker build --no-cache --load --target image-builder -f ${{ matrix.dockerfile }} -t paypal-auth-vm:${{ matrix.platform }} .
          CONTAINER_ID=$(docker create paypal-auth-vm:${{ matrix.platform }})
          docker cp $CONTAINER_ID:/build/paypal-auth-vm-bin ./paypal-auth-vm-${{ matrix.platform }}.bin || docker cp $CONTAINER_ID:/paypal-auth-vm-bin ./paypal-auth-vm-${{ matrix.platform }}.bin
          docker cp $CONTAINER_ID:/build/output/vmlinuz ./vmlinuz-${{ matrix.platform }} || true
          docker cp $CONTAINER_ID:/build/output/initramfs-paypal-auth.img ./initramfs-${{ matrix.platform }}.img || docker cp $CONTAINER_ID:/initramfs-paypal-auth.img ./initramfs-${{ matrix.platform }}.img || true
          docker cp $CONTAINER_ID:/build/output/shimx64.efi ./shimx64-${{ matrix.platform }}.efi || true
          docker cp $CONTAINER_ID:/build/output/grubx64.efi ./grubx64-${{ matrix.platform }}.efi || true
          docker cp $CONTAINER_ID:/grub.cfg ./grub-${{ matrix.platform }}.cfg || true
          docker cp $CONTAINER_ID:/disk.tar.gz ./disk-${{ matrix.platform }}.tar.gz || true
          docker cp $CONTAINER_ID:/paypal-auth-vm-oci.qcow2 ./disk-oci.qcow2 || true
          docker cp $CONTAINER_ID:/packages.txt ./packages-${{ matrix.platform }}.txt || true
          docker cp $CONTAINER_ID:/build/packages.txt ./packages-${{ matrix.platform }}.txt || true
          docker rm $CONTAINER_ID
          echo "==== ARTIFACT HASHES (${{ matrix.label }}) ===="
          sha256sum paypal-auth-vm-${{ matrix.platform }}.bin vmlinuz-${{ matrix.platform }} initramfs-${{ matrix.platform }}.img shimx64-${{ matrix.platform }}.efi grubx64-${{ matrix.platform }}.efi grub-${{ matrix.platform }}.cfg ${{ matrix.disk-file }} 2>/dev/null || true
          echo "========================="

      - name: Attest Enclave Binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Enclave Binary (${{ matrix.label }})
          subject-path: paypal-auth-vm-${{ matrix.platform }}.bin

      - name: Attest Kernel
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Linux Kernel (${{ matrix.label }})
          subject-path: vmlinuz-${{ matrix.platform }}

      - name: Attest Initrd
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Initramfs (${{ matrix.label }})
          subject-path: initramfs-${{ matrix.platform }}.img

      - name: Attest Bootloader
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: EFI Bootloader (${{ matrix.label }})
          subject-path: |
            shimx64-${{ matrix.platform }}.efi
            grubx64-${{ matrix.platform }}.efi
            grub-${{ matrix.platform }}.cfg

      - name: Attest VM Disk Image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: VM Disk Image (${{ matrix.label }})
          subject-path: ${{ matrix.disk-file }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vm-artifacts-${{ matrix.platform }}
          path: |
            paypal-auth-vm-${{ matrix.platform }}.bin
            initramfs-${{ matrix.platform }}.img
            vmlinuz-${{ matrix.platform }}
            ${{ matrix.disk-file }}
          retention-days: 7