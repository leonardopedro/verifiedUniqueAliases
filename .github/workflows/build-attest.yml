name: Build Alibaba VM Image and Attest

on:
  push:
    branches: [l-branch-1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and extract artifacts
        run: |
          set +e
          docker build --no-cache --target assembler -f Dockerfile.alibaba -t paypal-auth-vm:alibabacloud . 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          CONTAINER_ID=$(docker create paypal-auth-vm:alibabacloud)
          docker cp $CONTAINER_ID:/build/paypal-auth-vm-bin ./paypal-auth-vm-alibabacloud.bin 2>&1 || echo "no bin"
          docker cp $CONTAINER_ID:/build/output/vmlinuz ./vmlinuz-alibabacloud 2>&1 || echo "no vmlinuz"
          docker cp $CONTAINER_ID:/build/output/initramfs-paypal-auth.img ./initramfs-alibabacloud.img 2>&1 || echo "no initramfs"
          docker cp $CONTAINER_ID:/build/output/shimx64.efi ./shimx64-alibabacloud.efi 2>&1 || echo "no shim"
          docker cp $CONTAINER_ID:/build/output/grubx64.efi ./grubx64-alibabacloud.efi 2>&1 || echo "no grubx64"
          docker cp $CONTAINER_ID:/grub.cfg ./grub-alibabacloud.cfg 2>&1 || echo "no grub.cfg"
          docker cp $CONTAINER_ID:/disk-alibaba.raw ./disk-alibabacloud.raw 2>&1 || echo "no disk"
          docker cp $CONTAINER_ID:/build/packages.txt ./packages-alibabacloud.txt 2>&1 || echo "no packages"
          docker rm $CONTAINER_ID 2>&1 || true
          echo "=== extracted files ==="
          ls -la disk-alibabacloud.raw paypal-auth-vm-alibabacloud.bin initramfs-alibabacloud.img 2>&1
          test -f disk-alibabacloud.raw || { echo "DISK MISSING"; exit 1; }
          echo "DISK OK"
          echo "==== ARTIFACT HASHES (Alibaba Cloud Intel TDX) ===="
          sha256sum paypal-auth-vm-alibabacloud.bin vmlinuz-alibabacloud initramfs-alibabacloud.img shimx64-alibabacloud.efi grubx64-alibabacloud.efi grub-alibabacloud.cfg disk-alibabacloud.raw 2>/dev/null
          echo "========================="

      - name: Attest Enclave Binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Enclave Binary (Alibaba Cloud Intel TDX)
          subject-path: paypal-auth-vm-alibabacloud.bin

      - name: Attest Initrd
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: Initramfs (Alibaba Cloud Intel TDX)
          subject-path: initramfs-alibabacloud.img

      - name: Attest VM Disk Image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: VM Disk Image (Alibaba Cloud Intel TDX)
          subject-path: disk-alibabacloud.raw

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vm-artifacts-alibabacloud
          path: |
            paypal-auth-vm-alibabacloud.bin
            initramfs-alibabacloud.img
            vmlinuz-alibabacloud
            disk-alibabacloud.raw
            shimx64-alibabacloud.efi
            grubx64-alibabacloud.efi
            grub-alibabacloud.cfg
          retention-days: 7

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build.log
          retention-days: 3

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=========== build.log ==========="
          cat build.log || echo "no build.log"
          echo "=========== end ==========="

      - name: Download built disk
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: vm-artifacts-alibabacloud
          path: /tmp/disk-out

      - name: Publish disk to repo (plain blob, no LFS)
        if: success()
        run: |
          set -e
          git checkout -B l-branch-1
          cp /tmp/disk-out/disk-alibabacloud.raw disk-alibaba.raw
          ls -la disk-alibaba.raw
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -c filter.lfs.smudge= -c filter.lfs.required=false -c filter.lfs.clean= add disk-alibaba.raw
          git status --short
          git commit -m "chore: update reproducible disk-alibaba.raw ($(sha256sum disk-alibaba.raw | cut -d' ' -f1)) [skip ci]" \
            && echo "COMMITTED" || echo "NOTHING_TO_COMMIT"
          git push origin l-branch-1 2>&1 | tee publish.log
          echo "PUSH_EXIT=${PIPESTATUS[0]}"
          echo "PUSH_DONE"

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log
          retention-days: 3
